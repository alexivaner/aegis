[project]
name = "aegis-runtime"
version = "0.1.0"
description = "Independent experimental edge AI runtime with synthetic scenarios"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9", "mypy>=1.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aegis"]
